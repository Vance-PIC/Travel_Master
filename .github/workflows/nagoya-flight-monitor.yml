name: Nagoya Google Flights web test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Search Google Flights in headless browser
        id: scrape
        continue-on-error: true
        run: python3 scripts/nagoya_flight_monitor.py

      - name: Upload browser debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-flights-debug
          path: |
            travel/nagoya/flights/debug/
          if-no-files-found: ignore

      - name: Commit monitoring data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add travel/nagoya/flights/latest.json travel/nagoya/flights/history.csv || true
          if git diff --cached --quiet; then
            echo "No monitoring data changes."
          else
            git commit -m "Update Nagoya Google Flights monitoring data"
            git push
          fi

      - name: Fail if scrape failed
        if: steps.scrape.outcome != 'success'
        run: |
          echo "::error::Google Flights scrape did not produce a parseable result. Check google-flights-debug artifact."
          exit 1
