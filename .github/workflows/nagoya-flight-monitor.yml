name: Nagoya SerpApi flight monitor

on:
  schedule:
    # Daily production monitor at 09:12 Taiwan time.
    # Changing the cron also reactivates a deactivated GitHub scheduled workflow.
    - cron: "12 9 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:
    inputs:
      mode:
        description: "Full itinerary baseline or daily market monitoring"
        required: true
        type: choice
        default: monitor_query
        options:
          - monitor_query
          - full_query
      purchase_itinerary:
        description: "Optional explicit purchase preparation itinerary key (e.g. CI154+CI151)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: nagoya-flight-monitor
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check SerpApi credential
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          if [ -z "$SERPAPI_KEY" ]; then
            echo "::error::Repository secret SERPAPI_KEY is not configured."
            exit 2
          fi

      - name: Test monitoring policy without API usage
        run: python3 -m unittest discover -s tests -v

      - name: Search Google Flights exact-date fares
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          QUERY_MODE: ${{ github.event_name == 'schedule' && 'monitor_query' || inputs.mode }}
          PURCHASE_ITINERARY: ${{ inputs.purchase_itinerary }}
        run: |
          if [ -n "$PURCHASE_ITINERARY" ]; then
            python3 scripts/nagoya_flight_monitor.py --mode "$QUERY_MODE" --purchase-itinerary "$PURCHASE_ITINERARY"
          else
            python3 scripts/nagoya_flight_monitor.py --mode "$QUERY_MODE"
          fi

      - name: Commit monitoring data
        if: always()
        run: |
          git add travel/nagoya/flights/latest.json travel/nagoya/flights/history.csv
          if [ -f travel/nagoya/flights/itinerary_history.csv ]; then
            git add travel/nagoya/flights/itinerary_history.csv
          fi
          if [ -f travel/nagoya/flights/last-run.json ]; then
            git add travel/nagoya/flights/last-run.json
          fi
          if git diff --cached --quiet; then
            echo "No monitoring data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Nagoya SerpApi flight monitoring data"
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Upload monitoring evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nagoya-monitor-evidence
          path: |
            travel/nagoya/flights/latest.json
            travel/nagoya/flights/last-run.json
            travel/nagoya/flights/itinerary_history.csv
