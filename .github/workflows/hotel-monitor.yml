name: Hotel monitor executor
on:
  schedule:
    # GitHub Actions cron uses UTC. 01:50 UTC = 09:50 Asia/Taipei.
    - cron: "50 1 * * *"
  workflow_dispatch:
    inputs:
      monitor:
        description: Accommodation monitor
        required: true
        type: choice
        default: marunouchi-booked
        options:
          - marunouchi-booked
          - airport-candidate
permissions:
  contents: write
concurrency:
  group: nagoya-hotel-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: ${{ github.ref == 'refs/heads/master' }}
      - name: Verify triggering commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test executor without API calls
        run: python -m unittest discover -s scripts -p 'test_hotel*.py'
      - name: Run hotel monitors
        id: query
        env:
          SEARCHAPI_KEY: ${{ secrets.SEARCHAPI_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          MONITOR_ID: ${{ inputs.monitor }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            python scripts/hotel_executor.py run --monitor airport-candidate --allow-query
            python scripts/hotel_executor.py run --monitor marunouchi-booked --allow-query
          else
            python scripts/hotel_executor.py run --monitor "$MONITOR_ID" --allow-query
          fi
      - name: Save monitoring records including failed-run diagnostics
        if: always() && github.ref == 'refs/heads/master' && (steps.query.outcome == 'success' || steps.query.outcome == 'failure')
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then exit 0; fi
          if [ ! -d travel/nagoya/hotels ]; then exit 0; fi
          git add travel/nagoya/hotels
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data(hotel-monitor): save executor run'
          git pull --rebase origin master
          git push origin HEAD:master
      - name: Retain persistence and recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotel-monitor-${{ github.run_id }}
          path: travel/nagoya/hotels/
          include-hidden-files: true
          if-no-files-found: warn
