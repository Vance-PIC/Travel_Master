name: Nagoya SerpApi flight monitor

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "scripts/nagoya_flight_monitor.py"
      - ".github/workflows/nagoya-flight-monitor.yml"

permissions:
  contents: write

concurrency:
  group: nagoya-flight-monitor
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check SerpApi credential
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          if [ -z "$SERPAPI_KEY" ]; then
            echo "::error::Repository secret SERPAPI_KEY is not configured."
            exit 2
          fi

      - name: Search Google Flights exact-date fares
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python3 scripts/nagoya_flight_monitor.py

      - name: Commit monitoring data
        run: |
          if git diff --quiet -- travel/nagoya/flights/latest.json travel/nagoya/flights/history.csv; then
            echo "No monitoring data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add travel/nagoya/flights/latest.json travel/nagoya/flights/history.csv
          git commit -m "Update Nagoya SerpApi flight monitoring data"
          git pull --rebase origin master
          git push origin HEAD:master
